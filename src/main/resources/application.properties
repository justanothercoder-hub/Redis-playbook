spring.application.name=redis-project
# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/redis_demo
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration (Auto-creates tables based on your Java entities)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Declare our cache buckets explicitly
spring.cache.cache-names=productCache
# Use Redis as the cache provider
spring.cache.type=redis
